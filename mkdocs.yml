site_name: Ion
site_url: https://auxeno.github.io/ion/
site_description: A simple neural network library for JAX
repo_url: https://github.com/auxeno/ion
repo_name: auxeno/ion

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Core:
      - Module: core/module.md
      - Param: core/param.md
      - Optimizer: core/optimizer.md
      - Tree Utilities: core/tree.md
      - Checkpointing: core/checkpoint.md
  - NN:
      - nn/index.md
      - Reference: nn/reference.md
      - Layers:
          - Linear: nn/layers/linear.md
          - Convolution: nn/layers/conv.md
          - Attention: nn/layers/attention.md
          - Normalization: nn/layers/norm.md
          - Recurrent: nn/layers/recurrent.md
          - State Space: nn/layers/ssm.md
          - Embedding: nn/layers/embedding.md
          - Positional: nn/layers/positional.md
          - Pooling: nn/layers/pool.md
          - Dropout: nn/layers/dropout.md
          - LoRA: nn/layers/lora.md
          - MLP: nn/layers/mlp.md
          - Sequential: nn/layers/sequential.md
  - GNN:
      - gnn/index.md
      - Reference: gnn/reference.md
      - Layers:
          - GCN: gnn/layers/gcn.md
          - GAT: gnn/layers/gat.md
          - GIN: gnn/layers/gin.md
      - Ops: gnn/ops.md
  - Guides:
      - Sharp Edges: guides/sharp-edges.md
  - Examples:
      - examples/index.md
      - Getting started:
          - Ion Tour: examples/ion-tour.ipynb
      - Vision:
          - CNN on MNIST: examples/cnn-mnist.md
          - RNN on MNIST: examples/rnn-mnist.md
          - VAE on MNIST: examples/vae-mnist.ipynb
      - Sequence modeling:
          - GPT on TinyStories: examples/gpt-tinystories.ipynb
          - SSM on Pathfinder: examples/ssm-pathfinder.ipynb
      - Graphs:
          - GNN on Cora: examples/gnn-cora.md
          - GNN on BBBP: examples/gnn-bbbp.ipynb
      - Reinforcement learning:
          - DQN on Atari: examples/dqn-atari.ipynb
          - PPO on Gymnax: examples/ppo-gymnax.md
          - PQN on Gymnax: examples/pqn-gymnax.md

exclude_docs: |
  docstrings/
  templates/
  _extension.py
  hooks.py
  __pycache__/

hooks:
  - docs/hooks.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      include_requirejs: true
      ignore_h1_titles: true
  - mkdocstrings:
      custom_templates: docs/templates
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://docs.jax.dev/en/latest/objects.inv
            - https://optax.readthedocs.io/en/latest/objects.inv
          options:
            docstring_style: numpy
            docstring_section_style: list
            extensions:
              - docs/_extension.py
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            line_length: 400
            show_signature_annotations: false
            signature_crossrefs: true
            merge_init_into_class: true
            show_bases: false
            show_source: false
            members_order: source
