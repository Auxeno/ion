[project]
name = "ion-nn"
dynamic = ["version"]
description = "A simple library for neural and graph networks in JAX."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Alex Goddard"}]
keywords = ["jax", "neural-networks", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.5.0",
    "jaxtyping>=0.3.0",
    "optax",
    "treescope",
]

[project.urls]
Homepage = "https://github.com/auxeno/ion"
Documentation = "https://auxeno.github.io/ion/"
Repository = "https://github.com/auxeno/ion"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["ion"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pyright",
    "ruff",
    "ipykernel",
    "pip",
]
examples = [
    "gymnax",
    "gymnasium==1.2.3",
    "ale-py==0.11.2",
    "opencv-python-headless",
    "nbformat",
    "plotly",
    "pygame",
    "rdkit",
    "tqdm",
]
docs = [
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material",
    "mkdocstrings[python]",
]
benchmarks = [
    "equinox",
    "flax",
    "plotly",
    "torch",
]
all = [
    {include-group = "dev"},
    {include-group = "examples"},
    {include-group = "docs"},
    {include-group = "benchmarks"},
]

[tool.ruff]
src = ["."]
line-length=100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501", "UP"]
ignore = ["F722", "E731"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]
"benchmarks/implementations/*/*.py" = ["F722"]

[tool.pyright]
include = ["ion", "tests"]
typeCheckingMode = "standard"
reportIncompatibleMethodOverride = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # From Optax
    "ignore:Setting `jax_pmap_shmap_merge`:DeprecationWarning",
]
